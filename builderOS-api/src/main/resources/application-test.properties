spring.datasource.url=jdbc:h2:mem:builderos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.jwt.secret=test-development-secret-change-me-please-32chars
app.jwt.expiration-seconds=604800
app.cors.allowed-origins=http://localhost:3000
