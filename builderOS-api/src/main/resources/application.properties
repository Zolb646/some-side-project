spring.application.name=builderOS

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET:local-development-secret-change-me-please-32chars}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:604800}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
