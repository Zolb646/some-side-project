services:
  postgres:
    image: postgres:17
    container_name: builderos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: builderos
      POSTGRES_USER: builderos
      POSTGRES_PASSWORD: builderos
    ports:
      - "5432:5432"
    volumes:
      - builderos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builderos -d builderos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  builderos-postgres-data:
